[package]
name = "lance-dataset-merge"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Metadata-only concatenation of local Lance datasets"

[dependencies]
lance = { version = "=14.0.1", default-features = false }
lance-core = "=14.0.1"
lance-table = "=14.0.1"

[dev-dependencies]
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
